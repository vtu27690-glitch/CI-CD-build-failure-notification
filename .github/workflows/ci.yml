name: CI Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: pytest -v

      - name: Detect Build Failure
        if: ${{ failure() }}
        run: |
          echo "=============================="
          echo "BUILD FAILURE DETECTED"
          echo "=============================="
          echo "Status: FAILED"

      - name: Extract Error Log
        if: ${{ failure() }}
        run: |
          echo "==============================" > failure.log
          echo "ERROR / LOG DETAILS" >> failure.log
          echo "==============================" >> failure.log
          echo "Test failure detected." >> failure.log
          pytest -v >> failure.log 2>&1 || true
          cat failure.log
- name: Store Failure Information
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: failure-log
        path: failure.log

    - name: Send Failure Notification
      if: ${{ failure() }}
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: "CI Build Failure Detected",
            body: `Build failure detected.

Run: ${context.runNumber}
Commit: ${context.sha}

Please check the GitHub Actions logs and failure-log artifact.`
          })








    
